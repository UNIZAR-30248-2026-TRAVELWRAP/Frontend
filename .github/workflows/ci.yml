name: Frontend Integration Pipeline

on:
  push:
    branches: "main"
  pull_request:
    branches: "main"

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar entorno de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './Frontend/package-lock.json' 

      - name: Instalar dependencias
        run: npm ci
        working-directory: ./Frontend

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps
        working-directory: ./Frontend

      - name: Validar compilación TypeScript y Build de Vite
        run: npm run build
        working-directory: ./Frontend

      # Genera Frontend/coverage/lcov.info, que SonarCloud usa para medir la cobertura
      - name: Ejecutar pruebas automatizadas con cobertura
        run: npm run test:coverage
        working-directory: ./Frontend

      - name: Analizar código con SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}