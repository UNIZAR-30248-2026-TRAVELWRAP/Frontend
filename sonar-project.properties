sonar.projectKey=UNIZAR-30248-2026-TRAVELWRAP_Frontend
sonar.organization=unizar-30248-2026-travelwrap

# Indicar la carpeta del código fuente a analizar
sonar.sources=Frontend/src

# Excluir carpetas no relevantes para el análisis de código
sonar.exclusions=node_modules/**, dist/**, tests_cucumber/**

# Pruebas y cobertura (el informe lo genera npm run test:coverage en la CI)
sonar.tests=Frontend/tests_unit, Frontend/tests
sonar.javascript.lcov.reportPaths=Frontend/coverage/lcov.info
# Arranque de la aplicación y cableado de rutas: no se prueban con tests unitarios, sino con los E2E de Playwright.
# socket.ts es el ejemplo del canal de chat, que todavía no se usa
sonar.coverage.exclusions=Frontend/src/main.tsx, Frontend/src/App.tsx, Frontend/src/router/**, Frontend/src/services/socket.ts

# Codificación
sonar.sourceEncoding=UTF-8
